<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETFC Admin — Merch Orders</title>
<script>(function(){var t=localStorage.getItem("etfc_theme")||"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/main.js"></script>
</head>
<body>

<div class="admin-shell">
  <div class="admin-sidebar" style="display:flex;flex-direction:column;">
    <div class="nav-logo" style="padding:0 24px 20px;font-size:22px;">ET<span>FC</span> <span style="font-size:12px;color:var(--bone-dim);">Admin</span></div>
    <div style="padding:0 12px 8px;font-family:var(--font-mono);font-size:10px;color:var(--gold-bright);letter-spacing:2px;text-transform:uppercase;">TICKETS</div>
    <a href="index.html">Ticket Orders</a>
    <div style="padding:12px 12px 8px;font-family:var(--font-mono);font-size:10px;color:var(--gold-bright);letter-spacing:2px;text-transform:uppercase;">BETTING</div>
    <a href="odds.html">Betting Odds</a>
    <a href="bets.html">Bet Review</a>
    <div style="padding:12px 12px 8px;font-family:var(--font-mono);font-size:10px;color:var(--gold-bright);letter-spacing:2px;text-transform:uppercase;">SEATS</div>
    <a href="seats.html">Seat Management</a>
    <div style="padding:12px 12px 8px;font-family:var(--font-mono);font-size:10px;color:var(--gold-bright);letter-spacing:2px;text-transform:uppercase;">MERCH</div>
    <a href="merch.html">Merch Products</a>
    <a href="merch-orders.html" class="active">Merch Orders</a>
    <a href="#" style="margin-top:auto;color:var(--crimson-bright);" onclick="logout();return false;">Log Out</a>
  </div>

  <div class="admin-main">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:12px;">
      <div class="section-title" style="font-size:28px;margin-bottom:0;">Merch Orders</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" onclick="loadOrders('pending')"   id="filterPending">Pending</button>
        <button class="btn btn-outline btn-sm" onclick="loadOrders('confirmed')" id="filterConfirmed">Confirmed</button>
        <button class="btn btn-outline btn-sm" onclick="loadOrders('rejected')"  id="filterRejected">Rejected</button>
        <button class="btn btn-outline btn-sm" onclick="loadOrders('all')"       id="filterAll">All</button>
      </div>
    </div>

    <div class="admin-stat-row">
      <div class="stat-box"><div class="val" id="statCount">–</div><div class="lbl">Orders</div></div>
      <div class="stat-box"><div class="val" id="statRevenue">–</div><div class="lbl">Total (ETB)</div></div>
    </div>

    <div id="loadingMsg" class="text-dim">Loading orders…</div>
    <div id="errorMsg" class="text-dim" style="color:var(--crimson-bright);display:none;"></div>

    <table class="admin-table" id="ordersTable" style="display:none;">
      <thead>
        <tr>
          <th>Screenshot</th>
          <th>Product</th>
          <th>Buyer</th>
          <th>Color / Size</th>
          <th>Qty</th>
          <th>Amount</th>
          <th>Ref</th>
          <th>Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>

    <div id="emptyMsg" class="text-dim" style="display:none;">No orders in this view.</div>
  </div>
</div>

<script>
  let currentFilter = "pending";

  async function loadOrders(status = "pending") {
    currentFilter = status;
    // Highlight active filter button
    ["pending","confirmed","rejected","all"].forEach(s => {
      const btn = document.getElementById("filter" + s.charAt(0).toUpperCase() + s.slice(1));
      if (btn) btn.className = s === status ? "btn btn-primary btn-sm" : "btn btn-outline btn-sm";
    });

    document.getElementById("loadingMsg").style.display = "block";
    document.getElementById("errorMsg").style.display = "none";
    document.getElementById("ordersTable").style.display = "none";
    document.getElementById("emptyMsg").style.display = "none";

    try {
      const res = await fetch(`/api/admin-merch?type=orders&status=${status}`);
      if (res.status === 401) { window.location.href = "login.html"; return; }
      const data = await res.json();
      document.getElementById("loadingMsg").style.display = "none";
      if (!res.ok) {
        document.getElementById("errorMsg").textContent = data.error || "Failed to load orders.";
        document.getElementById("errorMsg").style.display = "block";
        return;
      }
      renderOrders(data.orders || []);
    } catch (err) {
      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("errorMsg").textContent = "Network error: " + err.message;
      document.getElementById("errorMsg").style.display = "block";
    }
  }

  function renderOrders(orders) {
    const tbody = document.getElementById("ordersBody");
    const table = document.getElementById("ordersTable");
    const empty = document.getElementById("emptyMsg");

    document.getElementById("statCount").textContent = orders.length;
    document.getElementById("statRevenue").textContent =
      orders.reduce((s, o) => s + (o.totalAmount || 0), 0).toLocaleString();

    if (orders.length === 0) { empty.style.display = "block"; return; }

    tbody.innerHTML = orders.map(o => {
      const s = o.status || "pending";
      const date = o.createdAt ? new Date(o.createdAt).toLocaleDateString("en-GB", {day:"numeric",month:"short",year:"numeric"}) : "—";
      const actionBtns = s === "pending"
        ? `<div style="display:flex;gap:6px;">
             <button class="btn btn-primary btn-sm" onclick="reviewOrder('${o.id}','approve')">Approve</button>
             <button class="btn btn-outline btn-sm" style="color:var(--crimson-bright);border-color:var(--crimson-bright);" onclick="reviewOrder('${o.id}','reject')">Reject</button>
           </div>`
        : `<span class="text-dim" style="font-size:12px;">—</span>`;

      return `<tr id="row-${o.id}">
        <td>${o.screenshotUrl
          ? `<a href="${o.screenshotUrl}" target="_blank"><img src="${o.screenshotUrl}" class="thumb-sm" style="object-fit:cover;"></a>`
          : `<span class="text-dim">—</span>`}
        </td>
        <td style="font-weight:600;">${o.productName || "—"}<br><span class="text-dim" style="font-size:11px;">${o.productSlug || ""}</span></td>
        <td>${o.buyerName || "—"}<br><span class="text-dim" style="font-size:11px;">${o.phone || ""}</span></td>
        <td>${o.color || "—"} / ${o.size || "—"}</td>
        <td>${o.quantity || 1}</td>
        <td style="color:var(--gold-bright);font-family:var(--font-mono);">${(o.totalAmount || 0).toLocaleString()} ETB</td>
        <td style="font-family:var(--font-mono);font-size:12px;">${o.refCode || "—"}</td>
        <td style="font-size:12px;">${date}</td>
        <td><span class="status-pill ${s}">${s === "confirmed" ? "✅" : s === "rejected" ? "❌" : "⏳"} ${s.charAt(0).toUpperCase() + s.slice(1)}</span></td>
        <td>${actionBtns}</td>
      </tr>`;
    }).join("");

    table.style.display = "table";
  }

  async function reviewOrder(orderId, action) {
    const label = action === "approve" ? "Approve" : "Reject";
    if (!confirm(`${label} this merch order?`)) return;

    try {
      const res = await fetch("/api/admin-merch?action=review", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ orderId, action }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Action failed.");
      showToast(`Order ${action === "approve" ? "approved" : "rejected"}.`, "success");
      loadOrders(currentFilter);
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  function logout() {
    document.cookie = "etfc_admin_session=; Max-Age=0; Path=/;";
    window.location.href = "login.html";
  }

  loadOrders("pending");
</script>
</body>
</html>
