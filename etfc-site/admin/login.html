<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — ETFC</title>
<script>(function(){var t=localStorage.getItem("etfc_theme")||"light";document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <div class="modal" style="position:static;">
    <div class="nav-logo" style="text-align:center;margin-bottom:20px;">ET<span>FC</span> <span style="font-size:12px;color:var(--bone-dim);">Admin</span></div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()">
    </div>
    <p id="loginError" class="text-dim" style="color:var(--crimson-bright);font-size:13px;display:none;margin-bottom:12px;"></p>
    <button class="btn btn-primary btn-block" onclick="login()">Sign In</button>
  </div>
</div>

<script>
  async function login() {
    const password = document.getElementById("passwordInput").value;
    const errEl = document.getElementById("loginError");
    errEl.style.display = "none";

    try {
      const res = await fetch("/api/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.error || "Login failed.";
        errEl.style.display = "block";
        return;
      }

      window.location.href = "index.html";
    } catch (err) {
      errEl.textContent = "Network error — try again.";
      errEl.style.display = "block";
    }
  }
</script>
</body>
</html>
