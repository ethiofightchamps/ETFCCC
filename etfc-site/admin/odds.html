<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETFC Admin — Betting Odds</title>
<script>(function(){var t=localStorage.getItem("etfc_theme")||"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/main.js"></script>
</head>
<body>

<div class="admin-shell">
  <div class="admin-sidebar" style="display:flex;flex-direction:column;">
    <div class="nav-logo" style="padding:0 24px 20px;font-size:22px;">ET<span>FC</span> <span style="font-size:12px;color:var(--bone-dim);">Admin</span></div>
    <a href="index.html">Order Review</a>
    <a href="odds.html" class="active" style="border-top:1px solid var(--border);margin-top:8px;padding-top:20px;">Betting Odds</a>
    <a href="bets.html">Bet Review</a>
    <a href="seats.html">Seat Management</a>
    <a href="#" style="margin-top:auto;color:var(--crimson-bright);" onclick="logout();return false;">Log Out</a>
  </div>

  <div class="admin-main">
    <div class="section-title" style="font-size:28px;margin-bottom:8px;">Betting Odds</div>
    <p class="text-dim" style="margin-bottom:24px;">
      Edit odds here — changes go live on the site immediately, no redeploy needed.
    </p>

    <div class="bank-box mt-24" style="display:flex;align-items:center;justify-content:space-between;max-width:420px;">
      <div>
        <div style="font-weight:600;">Betting Status</div>
        <div class="text-dim" style="font-size:12px;" id="bettingStatusLabel">Checking…</div>
      </div>
      <button class="btn btn-primary btn-sm" id="bettingToggleBtn" onclick="toggleBetting()" disabled>…</button>
    </div>

    <div class="bank-box mt-24" style="display:flex;align-items:center;justify-content:space-between;max-width:420px;">
      <div>
        <div style="font-weight:600;">Min Stake (ETB)</div>
        <div class="text-dim" style="font-size:12px;">Minimum bet amount for accumulators</div>
      </div>
      <input type="number" id="minStakeInput" value="1" min="1" step="1" style="width:90px;background:var(--obsidian);border:1px solid var(--border);color:var(--bone);padding:8px 10px;border-radius:4px;" onchange="saveMinStake()">
    </div>

    <div id="seedPrompt" style="display:none;" class="tier-card" style="text-align:left;">
      <p>No fights loaded yet.</p>
      <button class="btn btn-primary btn-sm mt-24" onclick="seedFights()">Load ETFC's Fight Card</button>
    </div>

    <div id="loadingMsg" class="text-dim">Loading fights…</div>
    <div id="errorMsg" class="text-dim" style="color:var(--crimson-bright);display:none;"></div>

    <div id="fightsGroups"></div>
  </div>
</div>

<script>
  const DISCIPLINE_LABELS = { mma: "MMA", boxing: "Boxing", muaythai: "Muaythai" };

  async function loadFights() {
    document.getElementById("loadingMsg").style.display = "block";
    document.getElementById("errorMsg").style.display = "none";
    document.getElementById("seedPrompt").style.display = "none";
    document.getElementById("fightsGroups").innerHTML = "";

    try {
      const res = await fetch("/api/admin-fights");
      if (res.status === 401) { window.location.href = "login.html"; return; }
      const data = await res.json();
      document.getElementById("loadingMsg").style.display = "none";

      if (!res.ok) {
        document.getElementById("errorMsg").textContent = data.error || "Failed to load fights.";
        document.getElementById("errorMsg").style.display = "block";
        return;
      }

      if (data.fights.length === 0) {
        document.getElementById("seedPrompt").style.display = "block";
        return;
      }

      renderGroups(data.fights);
    } catch (err) {
      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("errorMsg").textContent = "Network error loading fights.";
      document.getElementById("errorMsg").style.display = "block";
    }
  }

  function renderGroups(fights) {
    const byDiscipline = {};
    fights.forEach((f) => {
      byDiscipline[f.discipline] = byDiscipline[f.discipline] || [];
      byDiscipline[f.discipline].push(f);
    });

    const mount = document.getElementById("fightsGroups");
    mount.innerHTML = Object.entries(byDiscipline).map(([discipline, list]) => `
      <div class="section-head mt-24"><div class="section-title" style="font-size:20px;">${DISCIPLINE_LABELS[discipline] || discipline}</div></div>
      <table class="admin-table">
        <thead><tr><th>Bout</th><th>Fighter</th><th>Odds</th><th>Fighter</th><th>Odds</th><th></th></tr></thead>
        <tbody>
          ${list.sort((a,b) => a.order - b.order).map((f) => `
            <tr data-fight-id="${f.id}">
              <td>${f.mainEvent ? "MAIN EVENT" : "Bout " + f.order}</td>
              <td>${f.fighterA}<br><span class="text-dim" style="font-size:11px;">${f.weightA || ""}</span></td>
              <td><input type="number" step="0.01" min="1.01" value="${f.oddsA}" style="width:70px;background:var(--obsidian);border:1px solid var(--border);color:var(--bone);padding:6px 8px;border-radius:4px;" data-side="A"></td>
              <td>${f.fighterB}<br><span class="text-dim" style="font-size:11px;">${f.weightB || ""}</span></td>
              <td><input type="number" step="0.01" min="1.01" value="${f.oddsB}" style="width:70px;background:var(--obsidian);border:1px solid var(--border);color:var(--bone);padding:6px 8px;border-radius:4px;" data-side="B"></td>
              <td><button class="btn btn-primary btn-sm" onclick="saveOdds(this)">Save</button></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `).join("");
  }

  async function saveOdds(btn) {
    const row = btn.closest("tr");
    const fightId = row.dataset.fightId;
    const oddsA = row.querySelector('input[data-side="A"]').value;
    const oddsB = row.querySelector('input[data-side="B"]').value;

    btn.setAttribute("disabled", "true");
    btn.textContent = "Saving…";

    try {
      const res = await fetch("/api/admin-fights", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "updateOdds", fightId, oddsA, oddsB }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Save failed.");
      showToast("Odds updated.", "success");
      btn.textContent = "Saved ✓";
      setTimeout(() => { btn.textContent = "Save"; btn.removeAttribute("disabled"); }, 1500);
    } catch (err) {
      showToast(err.message || "Could not save odds.", "error");
      btn.textContent = "Save";
      btn.removeAttribute("disabled");
    }
  }

  async function seedFights() {
    try {
      const res = await fetch("/api/admin-fights", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "seed" }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not seed fights.");
      showToast("Fight card loaded.", "success");
      loadFights();
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  function logout() {
    document.cookie = "etfc_admin_session=; Max-Age=0; Path=/;";
    window.location.href = "login.html";
  }

  let bettingEnabled = false;

  async function loadBettingStatus() {
    try {
      const res = await fetch("/api/admin-toggle-betting");
      if (res.status === 401) { window.location.href = "login.html"; return; }
      const data = await res.json();
      bettingEnabled = !!data.bettingEnabled;
      renderBettingStatus();
    } catch (err) {
      document.getElementById("bettingStatusLabel").textContent = "Could not load status.";
    }
  }

  function renderBettingStatus() {
    const label = document.getElementById("bettingStatusLabel");
    const btn = document.getElementById("bettingToggleBtn");
    label.textContent = bettingEnabled
      ? "Live — bet buttons are active on the site."
      : "Closed — bet buttons are locked on the site.";
    btn.textContent = bettingEnabled ? "Turn Off" : "Turn On";
    btn.removeAttribute("disabled");
  }

  async function toggleBetting() {
    const btn = document.getElementById("bettingToggleBtn");
    btn.setAttribute("disabled", "true");
    try {
      const res = await fetch("/api/admin-toggle-betting", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: !bettingEnabled }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not update betting status.");
      bettingEnabled = data.bettingEnabled;
      showToast(bettingEnabled ? "Betting is now live." : "Betting is now closed.", "success");
      renderBettingStatus();
    } catch (err) {
      showToast(err.message, "error");
      btn.removeAttribute("disabled");
    }
  }

  async function loadMinStake() {
    try {
      const res = await fetch("/api/admin-toggle-betting");
      if (res.status === 401) { window.location.href = "login.html"; return; }
      const data = await res.json();
      if (data.minStake) {
        document.getElementById("minStakeInput").value = data.minStake;
      }
    } catch (err) {
      console.warn("Could not load minStake:", err);
    }
  }

  async function saveMinStake() {
    const value = Number(document.getElementById("minStakeInput").value) || 1;
    try {
      const res = await fetch("/api/admin-toggle-betting", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ minStake: value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not save min stake.");
      showToast("Min stake updated.", "success");
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  loadBettingStatus();
  loadMinStake();
  loadFights();
</script>
</body>
</html>
