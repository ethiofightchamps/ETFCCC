<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — ETFC</title>
<script>(function(){var t=localStorage.getItem("etfc_theme")||"light";document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="nav-mount" data-active=""></div>

<div class="container" style="padding-top:48px;">
  <div class="section-title" style="font-size:34px;margin-bottom:8px;">My Account</div>
  <p class="text-dim" style="margin-bottom:24px;">
    <button onclick="loadDashboard(firebase.auth().currentUser)" class="btn btn-sm" style="font-size:12px;padding:4px 12px;">↻ Refresh</button>
  </p>

  <div class="section-head"><div class="section-title" style="font-size:20px;">My Tickets</div></div>
  <div id="ticketsContainer"><p class="text-dim">Loading your tickets…</p></div>

  <div class="section-head mt-24"><div class="section-title" style="font-size:20px;">My Bets</div></div>
  <div id="betsContainer"><p class="text-dim">Loading your bets…</p></div>
</div>

<div id="footer-mount"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script>
  async function loadDashboard(user) {
    const db = firebase.firestore();

    // ── My Tickets ──────────────────────────────────────────────────────────
    try {
      // Try email first, fall back to showing all orders where email matches
      const ordersSnap = await db.collection("orders")
        .where("userId", "==", user.uid)
        .orderBy("createdAt", "desc")
        .get();

      const ticketsEl = document.getElementById("ticketsContainer");
      if (ordersSnap.empty) {
        ticketsEl.innerHTML = '<p class="text-dim">No tickets yet — <a href="tickets.html" style="color:var(--gold-bright);">get tickets</a>.</p>';
        // Clear any stale pending order so tickets page resets
        localStorage.removeItem("etfc_pending_order");
      } else {
        // If any order is confirmed, clear the pending order flag so tickets.html resets
        const hasConfirmed = ordersSnap.docs.some(d => d.data().status === "confirmed");
        if (hasConfirmed) localStorage.removeItem("etfc_pending_order");

        ticketsEl.innerHTML = '<div class="grid-2">' +
          ordersSnap.docs.map(doc => {
            const o = doc.data();
            const seats = (o.seats || []).join(", ") || "—";
            const statusClass = o.status === "confirmed" ? "confirmed" : o.status === "rejected" ? "rejected" : "pending";
            const statusLabel = o.status === "confirmed" ? "✅ Confirmed" : o.status === "rejected" ? "❌ Rejected" : "⏳ Pending";
            const ticketCodeLine = o.status === "confirmed" && o.ticketCode
              ? `<p style="margin-top:8px;font-size:13px;font-family:monospace;color:var(--gold-bright);">🎟 ${o.ticketCode}</p>`
              : "";
            return `<div class="tier-card" style="text-align:left;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span class="tier-name" style="font-size:14px;">${seats}</span>
                <span class="status-pill ${statusClass}">${statusLabel}</span>
              </div>
              <p class="text-dim" style="margin-top:6px;font-size:13px;">Ref: ${o.refCode || "—"} &middot; ${o.totalAmount || 0} ETB</p>
              ${ticketCodeLine}
            </div>`;
          }).join("") +
        '</div>';
      }
    } catch (err) {
      document.getElementById("ticketsContainer").innerHTML =
        '<p style="color:var(--crimson-bright);">Could not load tickets. Try refreshing.</p>';
      console.error("tickets load failed:", err);
    }

    // ── My Bets ─────────────────────────────────────────────────────────────
    try {
      const betsSnap = await db.collection("bets")
        .where("userId", "==", user.uid)
        .orderBy("createdAt", "desc")
        .get();

      const betsEl = document.getElementById("betsContainer");
      if (betsSnap.empty) {
        betsEl.innerHTML = '<p class="text-dim">No bets yet.</p>';
      } else {
        betsEl.innerHTML = '<div class="grid-2">' +
          betsSnap.docs.map(doc => {
            const b = doc.data();
            const statusClass = b.status === "confirmed" ? "confirmed" : b.status === "rejected" ? "rejected" : "pending";
            const statusLabel = b.status === "confirmed" ? "Confirmed" : b.status === "rejected" ? "Rejected" : "Pending";
            return `<div class="tier-card" style="text-align:left;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span class="tier-name" style="font-size:14px;">${b.buyerName || "—"} — ${b.side || ""}</span>
                <span class="status-pill ${statusClass}">${statusLabel}</span>
              </div>
              <p class="text-dim" style="margin-top:6px;font-size:13px;">Stake: ${b.stake || 0} ETB &middot; Ref: ${b.refCode || "—"}</p>
            </div>`;
          }).join("") +
        '</div>';
      }
    } catch (err) {
      document.getElementById("betsContainer").innerHTML =
        '<p style="color:var(--crimson-bright);">Could not load bets.</p>';
      console.error("bets load failed:", err);
    }
  }

  // Wait for auth to resolve
  firebase.auth().onAuthStateChanged(user => {
    if (!user) {
      window.location.href = "login.html?redirect=dashboard.html";
    } else {
      loadDashboard(user);
    }
  });
</script>
</body>
</html>
