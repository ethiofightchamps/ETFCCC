<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tickets — ETFC</title>
<script>(function(){var t=localStorage.getItem("etfc_theme")||"light";document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="css/style.css">
<style>
  .ticket-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .ticket-card .ticket-left { flex: 1; }
  .ticket-card .ticket-seats {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .ticket-card .ticket-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .ticket-card .ticket-code {
    font-family: monospace;
    font-size: 13px;
    color: var(--gold-bright);
    background: rgba(176,141,62,0.1);
    border: 1px solid rgba(176,141,62,0.25);
    border-radius: 6px;
    padding: 4px 10px;
    display: inline-block;
    margin-top: 6px;
  }
  .ticket-card .ticket-amount {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    color: var(--gold-bright);
    white-space: nowrap;
  }
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    color: var(--text-dim);
  }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    margin-top: 40px;
  }
  .section-header h2 {
    font-family: var(--font-display);
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0;
  }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 12px;
    padding: 4px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>

<div id="nav-mount" data-active="dashboard"></div>

<div class="container" style="padding-top:48px;padding-bottom:64px;max-width:720px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
    <div class="section-eyebrow">Account</div>
  </div>
  <div class="section-title" style="font-size:34px;margin-bottom:0;">My Tickets</div>
  <p class="text-dim" style="margin-top:8px;margin-bottom:0;" id="userEmailLabel"></p>

  <div class="section-header" style="margin-top:32px;">
    <h2>Tickets</h2>
    <button class="refresh-btn" onclick="loadDashboard(firebase.auth().currentUser)">↻ Refresh</button>
  </div>
  <div id="ticketsContainer"><p class="text-dim">Loading…</p></div>

  <div class="section-header">
    <h2>Bets</h2>
  </div>
  <div id="betsContainer"><p class="text-dim">Loading…</p></div>
</div>

<div id="footer-mount"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script>
  const STATUS_ICON = { confirmed: "✅", rejected: "❌", pending: "⏳" };
  const STATUS_LABEL = { confirmed: "Confirmed", rejected: "Rejected", pending: "Pending" };

  async function loadDashboard(user) {
    if (!user) return;
    document.getElementById("userEmailLabel").textContent = user.email || "";
    const db = firebase.firestore();

    // ── Tickets ─────────────────────────────────────────────────────────────
    const ticketsEl = document.getElementById("ticketsContainer");
    try {
      const snap = await db.collection("orders")
        .where("userId", "==", user.uid)
        .get();

      // Also try email fallback for older orders saved before userId was added
      let docs = snap.docs;
      if (docs.length === 0) {
        const snapEmail = await db.collection("orders")
          .where("email", "==", user.email)
          .get();
        docs = snapEmail.docs;
      }

      docs.sort((a, b) => (b.data().createdAt?.toMillis?.() || 0) - (a.data().createdAt?.toMillis?.() || 0));

      if (docs.length === 0) {
        ticketsEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎟</div>
            <p style="margin:0 0 16px;">No tickets yet</p>
            <a href="tickets.html" class="btn btn-primary">Get Tickets</a>
          </div>`;
        localStorage.removeItem("etfc_pending_order");
      } else {
        const hasConfirmed = docs.some(d => d.data().status === "confirmed");
        if (hasConfirmed) localStorage.removeItem("etfc_pending_order");

        ticketsEl.innerHTML = docs.map(doc => {
          const o = doc.data();
          const seats = (o.seats || []).join(", ") || "—";
          const s = o.status || "pending";
          const ticketCode = (s === "confirmed" && o.ticketCode)
            ? `<div class="ticket-code">🎟 ${o.ticketCode}</div>` : "";
          const date = o.createdAt ? new Date(o.createdAt.toMillis()).toLocaleDateString("en-GB", {day:"numeric",month:"short",year:"numeric"}) : "";
          return `<div class="ticket-card">
            <div class="ticket-left">
              <div class="ticket-seats">${seats}</div>
              <div class="ticket-meta">Ref: ${o.refCode || "—"}${date ? " &middot; " + date : ""}</div>
              ${ticketCode}
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
              <span class="status-pill ${s}">${STATUS_ICON[s] || ""} ${STATUS_LABEL[s] || s}</span>
              <span class="ticket-amount">${(o.totalAmount || 0).toLocaleString()} ETB</span>
            </div>
          </div>`;
        }).join("");
      }
    } catch (err) {
      ticketsEl.innerHTML = `<p style="color:var(--crimson-bright);">Could not load tickets — ${err.message}</p>`;
      console.error("tickets:", err);
    }

    // ── Bets ─────────────────────────────────────────────────────────────────
    const betsEl = document.getElementById("betsContainer");
    try {
      const snap = await db.collection("bets")
        .where("userId", "==", user.uid)
        .get();

      let docs = snap.docs;
      if (docs.length === 0) {
        const snapEmail = await db.collection("bets").where("email", "==", user.email).get();
        docs = snapEmail.docs;
      }
      docs.sort((a, b) => (b.data().createdAt?.toMillis?.() || 0) - (a.data().createdAt?.toMillis?.() || 0));

      if (docs.length === 0) {
        betsEl.innerHTML = `<div class="empty-state"><div class="empty-icon">🥊</div><p style="margin:0;">No bets placed yet.</p></div>`;
      } else {
        betsEl.innerHTML = docs.map(doc => {
          const b = doc.data();
          const s = b.status || "pending";
          return `<div class="ticket-card">
            <div class="ticket-left">
              <div class="ticket-seats">${b.fighterName || b.side || "—"}</div>
              <div class="ticket-meta">Stake: ${(b.stake || 0).toLocaleString()} ETB &middot; Ref: ${b.refCode || "—"}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
              <span class="status-pill ${s}">${STATUS_ICON[s] || ""} ${STATUS_LABEL[s] || s}</span>
              <span class="ticket-amount">${(b.potentialPayout || 0).toLocaleString()} ETB potential</span>
            </div>
          </div>`;
        }).join("");
      }
    } catch (err) {
      betsEl.innerHTML = `<p style="color:var(--crimson-bright);">Could not load bets — ${err.message}</p>`;
      console.error("bets:", err);
    }
  }

  firebase.auth().onAuthStateChanged(user => {
    if (!user) {
      window.location.href = "login.html?redirect=dashboard.html";
    } else {
      loadDashboard(user);
    }
  });
</script>
</body>
</html>
