<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tickets — ETFC</title>
<script>(function(){var t=localStorage.getItem("etfc_theme")||"light";document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="css/style.css">
<style>
  .ticket-card {
    background: var(--obsidian-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.25);
  }
  .ticket-card.confirmed {
    border-color: var(--gold);
    box-shadow: 0 8px 32px rgba(176,141,62,0.15);
  }
  .ticket-card.pending {
    border-color: rgba(176,141,62,0.4);
  }
  .ticket-card.rejected {
    opacity: 0.7;
  }

  .ticket-visual {
    position: relative;
    background: linear-gradient(135deg, var(--obsidian) 0%, var(--obsidian-2) 50%, #1a1508 100%);
    border-bottom: 3px solid var(--gold);
    padding: 24px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
  }
  [data-theme="light"] .ticket-visual {
    background: linear-gradient(135deg, #1c1a16 0%, #2a251a 50%, #3d3420 100%);
    border-bottom-color: var(--gold);
  }

  .ticket-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .ticket-logo {
    font-family: var(--font-display);
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--gold-bright);
    text-shadow: 0 2px 8px rgba(176,141,62,0.4);
  }
  .ticket-logo span { color: var(--crimson-bright); }
  .ticket-badge {
    background: var(--crimson);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 3px;
    font-weight: 700;
  }
  .ticket-badge.pending { background: var(--gold); color: #1a1508; }
  .ticket-badge.rejected { background: #444; color: #888; }

  .ticket-main {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
  }
  .ticket-event-info {
    flex: 1;
  }
  .ticket-event-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--bone-dim);
    margin-bottom: 4px;
  }
  .ticket-event-name {
    font-family: var(--font-display);
    font-size: 32px;
    letter-spacing: 1px;
    color: var(--bone);
    text-transform: uppercase;
    line-height: 1.1;
  }
  .ticket-event-date {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--gold-bright);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ticket-event-date::before {
    content: "";
    width: 16px;
    height: 1px;
    background: var(--gold);
    opacity: 0.5;
  }

  .ticket-qr-wrap {
    width: 120px;
    height: 120px;
    background: #fff;
    border-radius: 8px;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: 24px;
  }
  .ticket-qr-wrap canvas { width: 100%; height: 100%; }

  .ticket-bottom {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    border-top: 1px dashed rgba(176,141,62,0.3);
    padding: 16px 24px;
    background: rgba(0,0,0,0.2);
  }
  .ticket-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 0 12px;
  }
  .ticket-field:not(:last-child) {
    border-right: 1px dashed rgba(176,141,62,0.2);
  }
  .ticket-field-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--bone-dim);
  }
  .ticket-field-value {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--bone);
    letter-spacing: 0.5px;
  }
  .ticket-field-value.seats { font-size: 16px; }
  .ticket-field-value.code { font-family: var(--font-mono); font-size: 13px; color: var(--gold-bright); }

  .ticket-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    background: rgba(0,0,0,0.3);
    border-top: 1px solid rgba(255,255,255,0.03);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--bone-dim);
  }
  .ticket-footer-note { color: var(--gold-bright); opacity: 0.8; }

  .ticket-sponsor-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 12px 0;
    flex-wrap: wrap;
  }
  .ticket-sponsor-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--bone-dim);
    margin-right: 4px;
  }
  .ticket-sponsor-row img {
    height: 36px;
    width: 36px;
    max-width: 120px;
    display: block;
    object-fit: cover;
    border-radius: 50%;
    filter: grayscale(40%);
    opacity: 0.95;
  }

  @media (max-width: 600px) {
    .ticket-sponsor-row {
      gap: 12px;
      padding: 8px 0;
    }
    .ticket-sponsor-row img {
      height: 28px;
      width: 28px;
      max-width: 100px;
    }
    .ticket-sponsor-label {
      font-size: 8px;
    }
  }
  @media (max-width: 400px) {
    .ticket-sponsor-row img {
      height: 24px;
      width: 24px;
      max-width: 80px;
    }
    .ticket-sponsor-row {
      gap: 8px;
    }
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    color: var(--text-dim);
  }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    margin-top: 40px;
  }
  .section-header h2 {
    font-family: var(--font-display);
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0;
  }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 12px;
    padding: 4px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

  @media (max-width: 520px) {
    .ticket-main { flex-direction: column; align-items: flex-start; gap: 16px; }
    .ticket-qr-wrap { width: 100px; height: 100px; margin-left: 0; }
    .ticket-event-name { font-size: 24px; }
    .ticket-bottom { grid-template-columns: 1fr; }
    .ticket-field:not(:last-child) { border-right: none; border-bottom: 1px dashed rgba(176,141,62,0.2); padding-bottom: 12px; }
  }
</style>
</head>
<body>

<div id="nav-mount" data-active="dashboard"></div>

<div class="container" style="padding-top:48px;padding-bottom:64px;max-width:720px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
    <div class="section-eyebrow">Account</div>
  </div>
  <div class="section-title" style="font-size:34px;margin-bottom:0;">My Tickets</div>
  <p class="text-dim" style="margin-top:8px;margin-bottom:0;" id="userEmailLabel"></p>

  <div class="section-header" style="margin-top:32px;">
    <h2>Tickets</h2>
    <button class="refresh-btn" onclick="loadDashboard(firebase.auth().currentUser)">↻ Refresh</button>
  </div>
  <div id="ticketsContainer"><p class="text-dim">Loading…</p></div>

  <div class="section-header" style="margin-top:32px;">
    <h2>Merch Orders</h2>
  </div>
  <div id="merchContainer"><p class="text-dim">Loading…</p></div>

  <p class="text-dim" style="font-size:12px;margin-top:32px;text-align:center;">
    Looking for your bets? They've moved to the <a href="betting.html" style="color:var(--gold-bright);">Betting page</a>.
  </p>
</div>

<div id="footer-mount"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  const STATUS_ICON = { confirmed: "✅", rejected: "❌", pending: "⏳" };
  const STATUS_LABEL = { confirmed: "Confirmed", rejected: "Rejected", pending: "Pending" };
  const BADGE_LABEL = { confirmed: "E-TICKET", pending: "PENDING", rejected: "REJECTED" };
  const BADGE_CLASS = { confirmed: "", pending: "pending", rejected: "rejected" };

  const EVENT_DATE_STR = "August 27, 2026";
  const EVENT_TIME_STR = "4:00 PM";
  const VENUE_STR = "Adwa Museum, Addis Ababa";

  let ticketsUnsubscribe = null;
  let ticketsEmailUnsubscribe = null;
  let merchUnsubscribe = null;
  let merchEmailUnsubscribe = null;

function renderTicketQR(qrData, containerId) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = "";
    try {
      new QRCode(el, {
        text: qrData,
        width: 104,
        height: 104,
        colorDark: "#0d0d0d",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (e) {
      console.warn("QR generation failed:", e);
      el.innerHTML = `<div style="width:104px;height:104px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#666;">QR Error</div>`;
    }
  }

  function downloadTicketImage(ticketCode, seats) {
    // Create a canvas with the ticket design for download
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const scale = 2; // 2x for quality
    canvas.width = 400 * scale;
    canvas.height = 560 * scale;
    ctx.scale(scale, scale);

    const isLight = document.documentElement.getAttribute("data-theme") === "light";
    const bgDark = isLight ? "#1a1a2e" : "#0d0d0d";
    const bgMid = isLight ? "#2a2a4a" : "#1a0505";
    const textColor = isLight ? "#e8e8e8" : "#ffffff";
    const textDim = isLight ? "#a0a0b0" : "#999999";
    const goldColor = "#b08d3e";

    // Draw background
    const gradient = ctx.createLinearGradient(0, 0, 0, 560);
    gradient.addColorStop(0, bgDark);
    gradient.addColorStop(0.5, bgMid);
    gradient.addColorStop(1, bgDark);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 400, 560);

    // Gold top border
    ctx.fillStyle = goldColor;
    ctx.fillRect(0, 0, 400, 4);

    // Header
    ctx.fillStyle = goldColor;
    ctx.font = "bold 12px 'Oswald', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("E-TICKET · CONFIRMED", 200, 30);

    ctx.fillStyle = textColor;
    ctx.font = "bold 24px 'Oswald', sans-serif";
    ctx.fillText("ETFC FIGHT NIGHT", 200, 60);

    ctx.fillStyle = textDim;
    ctx.font = "11px 'Space Mono', monospace";
    ctx.fillText("August 27, 2026 · 6:00 PM · Adwa Museum", 200, 80);

    // Seats
    ctx.fillStyle = textDim;
    ctx.font = "10px 'Space Mono', monospace";
    ctx.fillText("SEATS", 200, 120);
    ctx.fillStyle = textColor;
    ctx.font = "bold 14px 'Space Mono', monospace";
    ctx.fillText(seats, 200, 140);

    // Ticket code
    ctx.fillStyle = textDim;
    ctx.font = "10px 'Space Mono', monospace";
    ctx.fillText("TICKET CODE", 200, 170);
    ctx.fillStyle = goldColor;
    ctx.font = "bold 16px 'Space Mono', monospace";
    ctx.fillText(ticketCode, 200, 192);

    // QR Code placeholder
    ctx.fillStyle = isLight ? "#ffffff" : "#0d0d0d";
    ctx.fillRect(100, 220, 200, 200);
    ctx.fillStyle = isLight ? "#1a1a2e" : "#ffffff";
    ctx.font = "12px 'Space Mono', monospace";
    ctx.fillText("[QR CODE]", 200, 310);

    // Sponsor row
    ctx.fillStyle = textDim;
    ctx.font = "9px 'Space Mono', monospace";
    ctx.fillText("PRESENTED BY", 200, 340);

    // Bottom info
    ctx.fillStyle = goldColor;
    ctx.font = "11px 'Space Mono', monospace";
    ctx.fillText("Present at entry · Non-transferable", 200, 400);

    // Download
    const dataUrl = canvas.toDataURL("image/png");
    const link = document.createElement("a");
    link.download = `ETFC-Ticket-${ticketCode}.png`;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function renderTickets(docs) {
    const ticketsEl = document.getElementById("ticketsContainer");
    if (docs.length === 0) {
      ticketsEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎟</div>
          <p style="margin:0 0 16px;">No tickets yet</p>
          <a href="tickets.html" class="btn btn-primary">Get Tickets</a>
        </div>`;
      localStorage.removeItem("etfc_pending_order");
      return;
    }

    const hasConfirmed = docs.some(d => d.data().status === "confirmed");
    if (hasConfirmed) localStorage.removeItem("etfc_pending_order");

    ticketsEl.innerHTML = docs.map((doc, idx) => {
      const o = doc.data();
      const seats = (o.seats || []).join(", ") || "—";
      const s = o.status || "pending";
      const ticketCode = o.ticketCode || o.refCode || "—";
      const date = o.createdAt ? new Date(o.createdAt.toMillis()).toLocaleDateString("en-GB", {day:"numeric",month:"short",year:"numeric"}) : "";
      const qrId = `qr-${doc.id}-${idx}`;
      const qrData = `${window.location.origin}/verify.html?code=${ticketCode}`;

      setTimeout(() => renderTicketQR(qrData, qrId), 0);

      // Approved/Confirmed: show ticket + action to go to ticket
      // Rejected: show rejection message (not a ticket)
      // Pending: show pending ticket
      if (s === "rejected") {
        return `
          <div class="ticket-card rejected" style="border-color: var(--crimson);">
            <div class="ticket-visual" style="background: linear-gradient(135deg, #2a0a0a 0%, #1a0505 50%, #0d0a0a 100%); border-bottom-color: var(--crimson);">
              <div class="ticket-top">
                <div class="ticket-logo">ET<span>FC</span></div>
                <span class="ticket-badge rejected">REJECTED</span>
              </div>
              <div class="ticket-main" style="text-align: center; padding: 40px 20px;">
                <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
                <div class="ticket-event-name" style="color: var(--crimson-bright); font-size: 24px;">Order Rejected</div>
                <div style="color: var(--bone-dim); margin-top: 12px; line-height: 1.6;">
                  Your ticket order was not approved. <br>
                  <strong>Reason:</strong> ${o.rejectionReason || "Payment verification failed or seats no longer available."}
                </div>
                <a href="tickets.html" class="btn btn-primary" style="margin-top: 24px; display: inline-block;">Try Again</a>
              </div>
            </div>
            <div class="ticket-footer" style="justify-content: center; color: var(--crimson-bright);">
              ${o.buyerName || "Guest"} · ${date}
            </div>
          </div>`;
      }

if (s === "confirmed") {
        return `
          <div class="ticket-card confirmed">
            <div class="ticket-visual">
              <div class="ticket-top">
                <div class="ticket-logo">ET<span>FC</span></div>
                <span class="ticket-badge ${BADGE_CLASS[s]}">${BADGE_LABEL[s]}</span>
              </div>
              <div class="ticket-main">
                <div class="ticket-event-info">
                  <div class="ticket-event-label">ETFC Fight Night</div>
                  <div class="ticket-event-name">Adwa Museum</div>
                  <div class="ticket-event-date">${EVENT_DATE_STR} &middot; ${EVENT_TIME_STR}</div>
                </div>
                <div class="ticket-qr-wrap" id="${qrId}"></div>
              </div>
            </div>
            <div class="ticket-bottom">
              <div class="ticket-field">
                <div class="ticket-field-label">Seats</div>
                <div class="ticket-field-value seats">${seats}</div>
              </div>
              <div class="ticket-field">
                <div class="ticket-field-label">Section</div>
                <div class="ticket-field-value">${(o.seats || [])[0]?.split("-")[0] || "—"}</div>
              </div>
              <div class="ticket-field">
                <div class="ticket-field-label">Ticket Code</div>
                <div class="ticket-field-value code">${ticketCode}</div>
              </div>
            </div>
            <div class="ticket-sponsor-row">
              <span class="ticket-sponsor-label">Presented by</span>
              <img src="images/sponsors/mpesa.jpg" alt="M-Pesa">
              <img src="images/sponsors/genatv.jpg" alt="Gena TV">
              <img src="images/sponsors/sweatbox.jpg" alt="Sweat Box">
              <img src="images/sponsors/gofere.jpg" alt="Gofere">
            </div>
            <div class="ticket-footer">
              <span>${o.buyerName || "Guest"}</span>
              <span class="ticket-footer-note">Present QR at entry · Non-transferable</span>
            </div>
            <div style="padding: 12px 24px; background: rgba(176,141,62,0.1); border-top: 1px solid rgba(176,141,62,0.3); text-align: center; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
              <a href="verify.html?code=${ticketCode}" class="btn btn-primary" style="display: inline-block;">View Ticket / Verify</a>
              <button class="btn btn-outline" onclick="downloadTicketImage('${ticketCode}', '${seats}')">📥 Download Ticket</button>
            </div>
          </div>`;
      }

      // Pending
      return `
        <div class="ticket-card pending">
          <div class="ticket-visual">
            <div class="ticket-top">
              <div class="ticket-logo">ET<span>FC</span></div>
              <span class="ticket-badge ${BADGE_CLASS[s]}">${BADGE_LABEL[s]}</span>
            </div>
            <div class="ticket-main">
              <div class="ticket-event-info">
                <div class="ticket-event-label">ETFC Fight Night</div>
                <div class="ticket-event-name">Adwa Museum</div>
                <div class="ticket-event-date">${EVENT_DATE_STR} &middot; ${EVENT_TIME_STR}</div>
              </div>
              <div class="ticket-qr-wrap" id="${qrId}"></div>
            </div>
          </div>
          <div class="ticket-bottom">
            <div class="ticket-field">
              <div class="ticket-field-label">Seats</div>
              <div class="ticket-field-value seats">${seats}</div>
            </div>
            <div class="ticket-field">
              <div class="ticket-field-label">Section</div>
              <div class="ticket-field-value">${(o.seats || [])[0]?.split("-")[0] || "—"}</div>
            </div>
            <div class="ticket-field">
              <div class="ticket-field-label">Ticket Code</div>
              <div class="ticket-field-value code">${ticketCode}</div>
            </div>
          </div>
          <div class="ticket-sponsor-row">
            <span class="ticket-sponsor-label">Presented by</span>
            <img src="images/sponsors/mpesa.jpg" alt="M-Pesa">
            <img src="images/sponsors/genatv.jpg" alt="Gena TV">
            <img src="images/sponsors/sweatbox.jpg" alt="Sweat Box">
            <img src="images/sponsors/gofere.jpg" alt="Gofere">
          </div>
          <div class="ticket-footer">
            <span>${o.buyerName || "Guest"}</span>
            <span class="ticket-footer-note">Awaiting payment verification · Check back soon</span>
          </div>
        </div>`;
    }).join("");
  }

  function renderMerchOrders(docs) {
    const merchEl = document.getElementById("merchContainer");
    if (!merchEl) return;

    if (docs.length === 0) {
      merchEl.innerHTML = `<div class="empty-state"><div class="empty-icon">🛍</div><p style="margin:0 0 16px;">No merch orders yet</p><a href="merch.html" class="btn btn-primary">Shop Merch</a></div>`;
      return;
    }

    merchEl.innerHTML = docs.map(doc => {
      const o = doc.data();
      const s = o.status || "pending";
      const date = o.createdAt ? new Date(o.createdAt.toMillis()).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "";

      if (s === "rejected") {
        return `
          <div class="ticket-card rejected" style="border-color: var(--crimson); background: var(--obsidian-2);">
            <div style="padding: 24px; display: flex; flex-direction: column; gap: 12px;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                  <div style="font-weight: 600; color: var(--bone); font-size: 16px;">${o.productName || "—"}</div>
                  <div style="font-size: 13px; color: var(--bone-dim);">${o.color || ""} / ${o.size || ""} × ${o.quantity || 1} · Ref: ${o.refCode || "—"}${date ? " · " + date : ""}</div>
                </div>
                <span class="status-pill rejected" style="background: rgba(179,20,28,0.2); color: var(--crimson-bright); border: 1px solid var(--crimson);">❌ Rejected</span>
              </div>
              <div style="color: var(--bone-dim); line-height: 1.6; background: rgba(179,20,28,0.1); padding: 16px; border-radius: 8px; border: 1px solid rgba(179,20,28,0.2);">
                <strong>Order Rejected</strong><br>
                Reason: ${o.rejectionReason || "Payment verification failed or item out of stock."}
              </div>
              <a href="merch.html" class="btn btn-primary" style="align-self: flex-start; margin-top: 8px;">Shop Again</a>
            </div>
          </div>`;
      }

      if (s === "confirmed") {
        return `
          <div class="ticket-card confirmed" style="background: var(--obsidian-2);">
            <div style="padding: 24px; display: flex; flex-direction: column; gap: 12px;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                  <div style="font-weight: 600; color: var(--bone); font-size: 16px;">${o.productName || "—"}</div>
                  <div style="font-size: 13px; color: var(--bone-dim);">${o.color || ""} / ${o.size || ""} × ${o.quantity || 1} · Ref: ${o.refCode || "—"}${date ? " · " + date : ""}</div>
                </div>
                <span class="status-pill confirmed" style="background: rgba(176,141,62,0.2); color: var(--gold-bright); border: 1px solid var(--gold);">✅ Confirmed</span>
              </div>
              <div style="color: var(--gold-bright); background: rgba(176,141,62,0.1); padding: 16px; border-radius: 8px; border: 1px solid rgba(176,141,62,0.2);">
                <strong>Order Approved!</strong> Your merch is being prepared for shipment.
              </div>
              <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px;">
                <a href="dashboard.html" class="btn btn-primary" style="flex: 1; min-width: 140px; text-align: center;">View Orders</a>
                <a href="merch.html" class="btn btn-outline" style="flex: 1; min-width: 140px; text-align: center;">Continue Shopping</a>
              </div>
            </div>
          </div>`;
      }

      // Pending
      return `
        <div class="ticket-card pending" style="background: var(--obsidian-2);">
          <div style="padding: 24px; display: flex; flex-direction: column; gap: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <div style="font-weight: 600; color: var(--bone); font-size: 16px;">${o.productName || "—"}</div>
                <div style="font-size: 13px; color: var(--bone-dim);">${o.color || ""} / ${o.size || ""} × ${o.quantity || 1} · Ref: ${o.refCode || "—"}${date ? " · " + date : ""}</div>
              </div>
              <span class="status-pill pending" style="background: rgba(176,141,62,0.2); color: var(--gold-bright); border: 1px solid var(--gold);">⏳ Pending</span>
            </div>
            <div style="color: var(--bone-dim); background: rgba(176,141,62,0.05); padding: 16px; border-radius: 8px; border: 1px dashed rgba(176,141,62,0.3);">
              <strong>Awaiting Verification</strong><br>
              Your payment is being reviewed. You'll see an update here automatically when approved.
            </div>
          </div>
        </div>`;
    }).join("");
  }

  function loadDashboard(user) {
    if (!user) return;
    document.getElementById("userEmailLabel").textContent = user.email || "";
    const db = firebase.firestore();

    // ── Tickets (real-time) ────────────────────────────────────────────────────
    // Query by userId AND email (merge results) since some orders may have empty userId
    const ticketsQueryByUid = db.collection("orders").where("userId", "==", user.uid);
    const ticketsQueryByEmail = user.email ? db.collection("orders").where("email", "==", user.email) : null;

    let ticketsByUid = [];
    let ticketsByEmail = [];

    if (ticketsUnsubscribe) ticketsUnsubscribe();
    if (ticketsEmailUnsubscribe) ticketsEmailUnsubscribe();

    function mergeAndRenderTickets() {
      // Merge and deduplicate by doc ID
      const merged = [...ticketsByUid];
      for (const doc of ticketsByEmail) {
        if (!merged.some(d => d.id === doc.id)) merged.push(doc);
      }
      merged.sort((a, b) => (b.data().createdAt?.toMillis?.() || 0) - (a.data().createdAt?.toMillis?.() || 0));
      renderTickets(merged);
    }

    ticketsUnsubscribe = ticketsQueryByUid.onSnapshot(snap => {
      ticketsByUid = snap.docs;
      mergeAndRenderTickets();
    }, err => {
      console.error("tickets (uid):", err);
    });

    if (ticketsQueryByEmail) {
      ticketsEmailUnsubscribe = ticketsQueryByEmail.onSnapshot(snap => {
        ticketsByEmail = snap.docs;
        mergeAndRenderTickets();
      }, err => {
        console.error("tickets (email):", err);
      });
    }

    // ── Merch Orders (real-time) ───────────────────────────────────────────────
    const merchQueryByUid = db.collection("merchOrders").where("userId", "==", user.uid);
    const merchQueryByEmail = user.email ? db.collection("merchOrders").where("email", "==", user.email) : null;

    let merchByUid = [];
    let merchByEmail = [];

    if (merchUnsubscribe) merchUnsubscribe();
    if (merchEmailUnsubscribe) merchEmailUnsubscribe();

    function mergeAndRenderMerch() {
      const merged = [...merchByUid];
      for (const doc of merchByEmail) {
        if (!merged.some(d => d.id === doc.id)) merged.push(doc);
      }
      merged.sort((a, b) => (b.data().createdAt?.toMillis?.() || 0) - (a.data().createdAt?.toMillis?.() || 0));
      renderMerchOrders(merged);
    }

    merchUnsubscribe = merchQueryByUid.onSnapshot(snap => {
      merchByUid = snap.docs;
      mergeAndRenderMerch();
    }, err => {
      console.error("merch (uid):", err);
    });

    if (merchQueryByEmail) {
      merchEmailUnsubscribe = merchQueryByEmail.onSnapshot(snap => {
        merchByEmail = snap.docs;
        mergeAndRenderMerch();
      }, err => {
        console.error("merch (email):", err);
      });
    }
  }

  function loadMerchOrders(user) {
    // Now handled by real-time listener in loadDashboard
  }

  firebase.auth().onAuthStateChanged(user => {
    if (!user) {
      window.location.href = "login.html?redirect=dashboard.html";
    } else {
      loadDashboard(user);
    }
  });

  // Cleanup on page unload
  window.addEventListener("beforeunload", () => {
    if (ticketsUnsubscribe) ticketsUnsubscribe();
    if (ticketsEmailUnsubscribe) ticketsEmailUnsubscribe();
    if (merchUnsubscribe) merchUnsubscribe();
    if (merchEmailUnsubscribe) merchEmailUnsubscribe();
  });
</script>
</body>
</html>
