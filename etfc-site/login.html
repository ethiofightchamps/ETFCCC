<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — ETFC</title>
<script>(function(){var t=localStorage.getItem("etfc_theme")||"light";document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="nav-mount" data-active=""></div>

<div class="auth-page">
  <div class="auth-card">

    <div id="authStepChoice" class="auth-step">
      <h1><span data-i18n="auth.welcome">Welcome Back</span></h1>
      <p class="sub"><span data-i18n="auth.login-sub">Log in to buy tickets or place bets.</span></p>
      <button class="btn btn-outline btn-block" onclick="signInWithGoogle()">
        <span style="margin-right:8px;">&#128101;</span><span data-i18n="auth.google">Continue with Google</span>
      </button>
      <div class="auth-divider"><span>or</span></div>
      <div class="field">
        <label><span data-i18n="auth.email-addr">Email Address</span></label>
        <input type="email" id="loginEmailInput" placeholder="you@example.com" autocomplete="email">
      </div>
      <button class="btn btn-primary btn-block" onclick="continueLoginWithEmail(event)">Continue</button>
      <p class="auth-switch"><span data-i18n="auth.new-here">New here?</span> <a href="signup.html"><span data-i18n="auth.signup-link">Create an Account</span></a></p>
    </div>

    <div id="authStepLogin" class="auth-step" style="display:none;">
      <h3>Enter Password</h3>
      <p class="sub">Logging in as <strong id="loginEmailDisplay"></strong></p>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPasswordInput" placeholder="Password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" onclick="loginWithEmail(event)">Log In</button>
      <p class="auth-switch"><a href="#" onclick="sendPasswordReset(event)">Forgot password?</a></p>
      <p class="auth-switch"><a href="#" onclick="backToChoice(event)">&larr; Back</a></p>
    </div>

  </div>
</div>

<div id="footer-mount"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
    <script src="js/partials.js"></script>
<script src="js/main.js"></script>
</body>
</html>
