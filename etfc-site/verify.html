<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Ticket — ETFC</title>
    <script>
      (function () {
        var t = localStorage.getItem("etfc_theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="nav-mount" data-active=""></div>

    <div
      class="container"
      style="
        padding-top: 48px;
        padding-bottom: 64px;
        max-width: 520px;
        text-align: center;
      "
    >
      <div id="verifyLoading" style="padding: 60px 20px">
        <div style="font-size: 48px; margin-bottom: 16px">&#9203;</div>
        <p class="text-dim">Verifying ticket…</p>
      </div>

      <div id="verifySuccess" style="display: none">
        <div style="font-size: 64px; margin-bottom: 16px">&#10003;</div>
        <h2
          style="
            font-family: var(--font-display);
            font-size: 32px;
            text-transform: uppercase;
          "
        >
          Valid Ticket
        </h2>
        <div
          class="mt-24"
          style="
            text-align: left;
            background: var(--obsidian-2);
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 20px;
          "
        >
          <div class="row">
            <span>Ticket Code</span
            ><span
              id="vTicketCode"
              style="color: var(--gold-bright); font-family: var(--font-mono)"
            ></span>
          </div>
          <div class="row"><span>Event</span><span>ETFC Fight Night</span></div>
          <div class="row"><span>Date</span><span id="vDate"></span></div>
          <div class="row">
            <span>Venue</span><span>Adwa Museum, Addis Ababa</span>
          </div>
          <div class="row"><span>Seats</span><span id="vSeats"></span></div>
          <div class="row"><span>Buyer</span><span id="vBuyer"></span></div>
        </div>
        <p class="text-dim mt-24" style="font-size: 13px">
          Show this screen at entry.
        </p>
      </div>

      <div id="verifyError" style="display: none">
        <div
          style="
            font-size: 64px;
            margin-bottom: 16px;
            color: var(--crimson-bright);
          "
        >
          &#10007;
        </div>
        <h2
          style="
            font-family: var(--font-display);
            font-size: 32px;
            text-transform: uppercase;
            color: var(--crimson-bright);
          "
        >
          Invalid Ticket
        </h2>
        <p class="text-dim mt-24" id="errorMessage">
          This ticket code was not found.
        </p>
      </div>
    </div>

    <div id="footer-mount"></div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/main.js"></script>
    <script>
      // Get ticket code from query param: /verify.html?code=ETFC-ABC123
      const urlParams = new URLSearchParams(window.location.search);
      const ticketCode = urlParams.get("code");

      async function verifyTicket() {
        console.log("Verifying ticket:", ticketCode);
        if (!ticketCode) {
          showError("No ticket code in this link.");
          return;
        }
        try {
          const db = firebase.firestore();

          // First try querying by ticketCode field
          console.log("Querying by ticketCode field...");
          let snap = await db
            .collection("orders")
            .where("ticketCode", "==", ticketCode)
            .limit(1)
            .get();

          console.log("ticketCode query result:", snap.empty ? "empty" : "found", snap.docs.length);

          // If that fails (no index yet) or returns nothing, try querying by
          // refCode as a fallback — older orders may have only refCode set
          if (snap.empty) {
            console.log("Querying by refCode field...");
            snap = await db
              .collection("orders")
              .where("refCode", "==", ticketCode)
              .limit(1)
              .get();
            console.log("refCode query result:", snap.empty ? "empty" : "found", snap.docs.length);
          }

          document.getElementById("verifyLoading").style.display = "none";

          if (snap.empty) {
            showError(`Ticket code "${ticketCode}" not found.`);
            return;
          }

          const order = snap.docs[0].data();
          console.log("Order found:", order.refCode, order.ticketCode, order.status);

          if (order.status !== "confirmed") {
            showError(
              `Ticket status is "${order.status}" — not approved for entry yet.`
            );
            return;
          }

          // Success
          document.getElementById("verifySuccess").style.display = "block";
          document.getElementById("vTicketCode").textContent = ticketCode;
          document.getElementById("vDate").textContent = order.createdAt
            ? new Date(order.createdAt.toMillis()).toLocaleDateString("en-GB", {
                day: "numeric",
                month: "short",
                year: "numeric",
              })
            : "—";
          document.getElementById("vSeats").textContent =
            (order.seats || []).join(", ") || "—";
          document.getElementById("vBuyer").textContent =
            order.buyerName || "—";
        } catch (err) {
          console.error("Verify failed:", err);
          // If it's a missing index error, try a simpler fallback
          if (
            err.code === "failed-precondition" ||
            err.message?.includes("index")
          ) {
            try {
              // Fallback: get all confirmed orders and match client-side
              // (only works at small scale — replace with index once created)
              const db = firebase.firestore();
              const allConfirmed = await db
                .collection("orders")
                .where("status", "==", "confirmed")
                .get();
              const match = allConfirmed.docs.find(
                (d) =>
                  d.data().ticketCode === ticketCode ||
                  d.data().refCode === ticketCode
              );
              document.getElementById("verifyLoading").style.display = "none";
              if (!match) {
                showError(`Ticket "${ticketCode}" not found.`);
                return;
              }
              const order = match.data();
              document.getElementById("verifySuccess").style.display = "block";
              document.getElementById("vTicketCode").textContent = ticketCode;
              document.getElementById("vDate").textContent = order.createdAt
                ? new Date(order.createdAt.toMillis()).toLocaleDateString(
                    "en-GB",
                    { day: "numeric", month: "short", year: "numeric" }
                  )
                : "—";
              document.getElementById("vSeats").textContent =
                (order.seats || []).join(", ") || "—";
              document.getElementById("vBuyer").textContent =
                order.buyerName || "—";
            } catch (fallbackErr) {
              showError(
                "Verification failed — check your internet connection."
              );
            }
          } else {
            showError("Verification failed: " + err.message);
          }
        }
      }

      function showError(msg) {
        document.getElementById("verifyLoading").style.display = "none";
        document.getElementById("verifyError").style.display = "block";
        document.getElementById("errorMessage").textContent = msg;
      }

      verifyTicket();
    </script>
  </body>
</html>
